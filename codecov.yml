# Codecov configuration. Coverage is uploaded by the Go 1.27 leg of
# .github/workflows/build.yml. The blocking gate is `make cover`: 100% of the
# statements, no exclusion. So there is no `ignore` list here either.
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 100%
    patch:
      default:
        target: 100%

comment:
  layout: "condensed_header, diff, files"
  behavior: default
  require_changes: false

name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        go: ['1.26', '1.27']
        include:
          - go: '1.27'
            lint: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run golangci-lint
        if: matrix.lint
        uses: golangci/golangci-lint-action@v9

      # No cgo, standard library only, 100% coverage, race detector.
      - name: Gates
        run: make check

      # Codecov shows the coverage on the PR. It never fails the job: the gate
      # above does. Skipped on fork PRs, which have no access to the secret.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.lint && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          # Without this the uploader also sends scripts/coverage.awk.
          disable_search: true
          fail_ci_if_error: false

  build-status:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All good'

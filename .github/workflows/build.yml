name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        go: ['1.26', '1.27']
        include:
          - go: '1.27'
            lint: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run golangci-lint
        if: matrix.lint
        uses: golangci/golangci-lint-action@v9

      # The README example and matrix, and api.txt, are generated: a stale one fails here.
      # api.txt is made with Go 1.27 only (go doc output is not promised stable).
      - name: Generated files are up to date
        if: matrix.lint
        run: |
          make api
          git diff --exit-code

      # No cgo, standard library only, 100% coverage, race detector.
      - name: Gates
        run: make check

      # Open and scan arbitrary bytes for 30 seconds, on one leg.
      - name: Fuzz
        if: matrix.lint
        run: make fuzz

      # The reference reader opens the files our writer makes, with the pinned vortex-data and
      # with the latest release.
      - uses: astral-sh/setup-uv@v10.4.0
        if: matrix.lint

      # The size gate (TestSizeRatios) reads the TPC-H and ClickBench files of the reference,
      # which live in .cache/fixtures and are not committed (about 5 MB, a few seconds), and the
      # expected values the oracle computes for them (<file>.expected.json, not committed either).
      - name: Dataset fixtures
        if: matrix.lint
        run: |
          make fixtures
          scripts/oracle-all.sh

      - name: Reference reads our files
        if: matrix.lint
        run: make interop

      # Codecov shows the coverage on the PR. It never fails the job: the gate
      # above does. Skipped on fork PRs, which have no access to the secret.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.lint && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          # Without this the uploader also sends scripts/coverage.awk.
          disable_search: true
          fail_ci_if_error: false

  # The benchmarks of the PR against main, compared with benchstat and posted on the PR. It
  # never blocks: the numbers of a shared runner are for information.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      VORTEX_BENCH_ROWS: '1000000'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Benchmark main and the PR
        run: |
          git worktree add --detach "$RUNNER_TEMP/main" "origin/${{ github.base_ref }}"
          (cd "$RUNNER_TEMP/main" && go test -run '^$' -bench . -benchmem -count 6 ./... > "$RUNNER_TEMP/old.txt" || true)
          go test -run '^$' -bench . -benchmem -count 6 ./... > "$RUNNER_TEMP/new.txt"
          # go run pkg@version does not touch go.mod: benchstat is not a dependency.
          go run golang.org/x/perf/cmd/benchstat@latest "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt" > "$RUNNER_TEMP/benchstat.txt" || true
          { echo '### Benchmarks against the base branch'; echo; echo '```'; cat "$RUNNER_TEMP/benchstat.txt"; echo '```'; } > "$RUNNER_TEMP/comment.md"

      - name: Post on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"

  build-status:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All good'

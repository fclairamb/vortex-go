name: Build

# A branch is built through its pull request, not twice. main is built on every merge: the
# README badge and the Codecov base come from it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        go: ['1.26', '1.27']
        include:
          - go: '1.27'
            lint: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run golangci-lint
        if: matrix.lint
        uses: golangci/golangci-lint-action@v9

      # The README example and matrix, and api.txt, are generated: a stale one fails here.
      # api.txt is made with Go 1.27 only (go doc output is not promised stable).
      - name: Generated files are up to date
        if: matrix.lint
        run: |
          make api
          git diff --exit-code

      # bench/ is a module of its own that uses this one in place: when a dependency of the
      # root moves, its go.mod must follow, or its benchmarks do not build. They did not from
      # the klauspost/compress update to 2026-11-21, and no parquet-go number was recorded.
      - name: bench/ builds
        if: matrix.lint
        run: |
          go -C bench mod tidy -diff
          go -C bench vet ./...

      # No cgo, standard library only, 100% coverage, race detector.
      - name: Gates
        run: make check

      # Open and scan arbitrary bytes for 30 seconds, on one leg.
      - name: Fuzz
        if: matrix.lint
        run: make fuzz

      # The reference reader opens the files our writer makes, with the pinned vortex-data and
      # with the latest release.
      - uses: astral-sh/setup-uv@v10.4.0
        if: matrix.lint

      # The size gate (TestSizeRatios) reads the TPC-H and ClickBench files of the reference,
      # which live in .cache/fixtures and are not committed (about 5 MB, a few seconds), and the
      # expected values the oracle computes for them (<file>.expected.json, not committed either).
      - name: Dataset fixtures
        if: matrix.lint
        run: |
          make fixtures
          scripts/oracle-all.sh

      - name: Reference reads our files
        if: matrix.lint
        run: make interop

      # Codecov shows the coverage on the PR. It never fails the job: the gate
      # above does. Skipped on fork PRs, which have no access to the secret.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.lint && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          # Without this the uploader also sends scripts/coverage.awk.
          disable_search: true
          fail_ci_if_error: false

  # The benchmarks of the PR against main, compared with benchstat and posted on the PR. It
  # never blocks: the numbers of a shared runner are for information.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      VORTEX_BENCH_ROWS: '1000000'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Benchmark main and the PR
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/main" "origin/$BASE_REF"
          # Interleaved, so that the drift of the runner hits both sides alike.
          scripts/bench-pr.sh "$RUNNER_TEMP/main" . "$RUNNER_TEMP"
          # go run pkg@version does not touch go.mod: benchstat is not a dependency. The text
          # table goes to the log, the CSV to bench/cmd/benchcomment, which writes the comment.
          benchstat='go run golang.org/x/perf/cmd/benchstat@latest'
          $benchstat main="$RUNNER_TEMP/old.txt" PR="$RUNNER_TEMP/new.txt" || true
          $benchstat -format csv main="$RUNNER_TEMP/old.txt" PR="$RUNNER_TEMP/new.txt" > "$RUNNER_TEMP/bench.csv"
          go -C bench test ./cmd/benchcomment
          go -C bench run ./cmd/benchcomment -in "$RUNNER_TEMP/bench.csv" \
            -head "$HEAD_SHA" -base "$(git rev-parse "origin/$BASE_REF")" -base-ref "$BASE_REF" \
            -repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, edited by every run, found by the marker on its first line.
      - name: Post on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- vortex-go:bench -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' |
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - > /dev/null
            echo "Edited comment $id"
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          fi

  build-status:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All good'

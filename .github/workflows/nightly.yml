name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  compat:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - uses: astral-sh/setup-uv@v10.3.3

      # The fixtures and the expected values of every release, keyed on the list of releases.
      - name: List the releases
        run: curl -fsSL https://vortex-compat-fixtures.s3.amazonaws.com/versions.json -o versions.json

      - name: Cache .cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: compat-${{ hashFiles('versions.json', '.vortex-version', 'tools/oracle/oracle.py') }}

      # Every published release against the reference reader. The README and the list of
      # releases it rewrites must be committed already.
      - name: make compat
        run: |
          make compat
          git diff --exit-code README.md testdata/compat-releases.txt

  fuzz:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Long fuzzing
        run: make fuzz FUZZTIME=30m
